<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f3">
  <title>Countdown to February</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f5f3; --card:#fff; --text:#151515; --muted:#858585; --border:#e8e8e5; --danger:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(920px,100%); }
    .weeks { margin-bottom:12px; }
    .countdown { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .unit { position:relative; overflow:hidden; background:var(--card); border:1px solid var(--border); border-radius:24px; padding:clamp(28px,5vw,48px) 16px; text-align:center; will-change:transform,opacity,box-shadow; }
    .weeks .unit { padding:clamp(24px,4vw,36px) 16px; }
    .number { display:block; font-size:clamp(42px,8vw,82px); line-height:.95; font-weight:600; letter-spacing:-.06em; font-variant-numeric:tabular-nums; }
    .weeks .number { font-size:clamp(36px,6vw,64px); }
    .label { display:block; margin-top:14px; color:var(--muted); font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }

    /* One red flash + a falling/cracking-card effect. Seconds are excluded. */
    .unit.tick { animation:breakFall .9s cubic-bezier(.2,.85,.3,1) both; }
    .unit.tick::before { content:""; position:absolute; inset:0; pointer-events:none; background:rgba(239,68,68,.95); opacity:0; animation:redFlash .9s ease-out both; }
    .unit.tick::after { content:""; position:absolute; left:50%; top:20%; width:1px; height:70%; background:rgba(239,68,68,.75); transform:translateX(-50%) rotate(8deg) scaleY(0); transform-origin:top; opacity:0; animation:crack .9s ease-out both; }
    @keyframes redFlash {
      0% { opacity:0; }
      10% { opacity:.72; }
      23% { opacity:0; }
      100% { opacity:0; }
    }
    @keyframes crack {
      0%,15% { opacity:0; transform:translateX(-50%) rotate(8deg) scaleY(0); }
      25% { opacity:.8; transform:translateX(-50%) rotate(8deg) scaleY(1); }
      55%,100% { opacity:0; transform:translateX(-50%) rotate(8deg) scaleY(1); }
    }
    @keyframes breakFall {
      0% { opacity:1; transform:translate3d(0,0,0) rotate(0deg) scale(1); box-shadow:0 0 0 rgba(239,68,68,0); }
      10% { transform:translate3d(-2px,0,0) rotate(-.7deg) scale(.995); box-shadow:0 0 0 2px rgba(239,68,68,.32); }
      20% { opacity:.9; transform:translate3d(3px,-1px,0) rotate(.8deg) scale(1.005); }
      34% { transform:translate3d(-3px,2px,0) rotate(-1deg) scale(.99); box-shadow:0 0 0 3px rgba(239,68,68,.12); }
      50% { transform:translate3d(2px,8px,0) rotate(1.5deg) scale(.985); }
      68% { opacity:.82; transform:translate3d(-1px,20px,0) rotate(-2deg) scale(.975); }
      82% { opacity:.5; transform:translate3d(1px,32px,0) rotate(2.5deg) scale(.96); }
      100% { opacity:1; transform:translate3d(0,0,0) rotate(0deg) scale(1); box-shadow:0 0 0 rgba(239,68,68,0); }
    }
    @media (prefers-reduced-motion: reduce) { .unit.tick { animation:redPulse .9s ease-out both; } .unit.tick::before,.unit.tick::after { display:none; } }
    @keyframes redPulse { 0%,100%{opacity:1} 15%{box-shadow:0 0 0 3px rgba(239,68,68,.35)} 25%{opacity:.75} 40%{opacity:1} }
    @media (max-width:640px) { .countdown { grid-template-columns:repeat(2,1fr); gap:10px; } .unit { border-radius:20px; padding:30px 12px; } .weeks .unit { padding:26px 12px; } }
  </style>
</head>
<body>
  <main aria-label="Countdown to February 1, 2027">
    <section class="weeks"><div class="unit" id="weeksCard"><span class="number" id="weeks">00</span><span class="label">Weeks</span></div></section>
    <section class="countdown">
      <div class="unit" id="daysCard"><span class="number" id="days">000</span><span class="label">Days</span></div>
      <div class="unit" id="hoursCard"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
      <div class="unit" id="minutesCard"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
      <div class="unit" id="secondsCard"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </section>
  </main>
  <script>
    const target=new Date("2027-02-01T00:00:00+07:00").getTime();
    const values={weeks:document.getElementById("weeks"),days:document.getElementById("days"),hours:document.getElementById("hours"),minutes:document.getElementById("minutes"),seconds:document.getElementById("seconds")};
    const cards={weeks:document.getElementById("weeksCard"),days:document.getElementById("daysCard"),hours:document.getElementById("hoursCard"),minutes:document.getElementById("minutesCard"),seconds:document.getElementById("secondsCard")};
    let previous=null;
    function animateChange(unit){ if(unit==="seconds") return; const card=cards[unit]; card.classList.remove("tick"); void card.offsetWidth; card.classList.add("tick"); }
    function updateCountdown(){
      const remaining=Math.max(0,target-Date.now());
      const totalDays=Math.floor(remaining/86400000);
      const current={weeks:Math.floor(totalDays/7),days:totalDays,hours:Math.floor((remaining%86400000)/3600000),minutes:Math.floor((remaining%3600000)/60000),seconds:Math.floor((remaining%60000)/1000)};
      for(const unit of ["weeks","days","hours","minutes","seconds"]){ const digits=unit==="days"?3:2; values[unit].textContent=String(current[unit]).padStart(digits,"0"); if(previous!==null&&current[unit]!==previous[unit]) animateChange(unit); }
      previous=current;
    }
    updateCountdown(); setInterval(updateCountdown,1000);
  </script>
</body>
</html>
